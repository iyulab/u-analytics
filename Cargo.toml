[package]
name = "u-analytics"
version = "0.3.0"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
description = "Statistical process control, process capability, Weibull reliability, change-point detection, measurement system analysis (Gage R&R), correlation, regression, distribution analysis, and hypothesis testing."
repository = "https://github.com/iyulab/u-analytics"
keywords = ["spc", "statistics", "quality", "weibull", "reliability"]
categories = ["science", "mathematics"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:serde"]
ffi = ["dep:serde", "dep:serde_json", "dep:libc"]

[dependencies]
u-numflow = { version = "0.2", path = "../../foundation/u-numflow" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
libc = { version = "0.2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1.4"
