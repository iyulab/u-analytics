name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/wasm.rs'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Not 'latest': the action resolves that at run time and silently falls
          # back to v0.9.1 when the lookup fails, which predates `--features` and
          # fails the build below. Two runs three minutes apart got v0.15.0 and
          # v0.9.1 from the same pinned action.
          version: 'v0.15.0'

      - name: Build WASM package (bundler + nodejs)
        run: |
          wasm-pack build --target bundler --scope iyulab --out-dir pkg --features wasm
          wasm-pack build --target nodejs --scope iyulab --out-dir pkg-node --features wasm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Merge nodejs target (node-compatible entry via exports map)
        run: |
          NAME=$(node -p "require('./pkg/package.json').main.slice(0,-3)")
          mkdir -p pkg/node
          cp "pkg-node/${NAME}.js" "pkg/node/${NAME}.cjs"
          cp "pkg-node/${NAME}_bg.wasm" pkg/node/
          cp "pkg-node/${NAME}.d.ts" "pkg/node/${NAME}.d.cts"
          sed -i "s|@ts-self-types=\"./${NAME}.d.ts\"|@ts-self-types=\"./${NAME}.d.cts\"|" "pkg/node/${NAME}.cjs"
          node <<'EOF'
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync("pkg/package.json", "utf8"));
          const n = p.main.slice(0, -3);
          p.exports = { ".": {
            node: { types: `./node/${n}.d.cts`, default: `./node/${n}.cjs` },
            types: `./${n}.d.ts`,
            default: `./${n}.js`,
          } };
          p.exports["./package.json"] = "./package.json";
          if (!p.files.includes("node")) p.files.push("node");
          p.sideEffects = [...(p.sideEffects || []), `./node/${n}.cjs`];
          fs.writeFileSync("pkg/package.json", JSON.stringify(p, null, 2) + "\n");
          EOF

      - name: Node smoke test (CJS require + ESM import)
        run: |
          PKG_NAME=$(node -p "require('./pkg/package.json').name")
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/pkg"
          node -e "const m = require('$PKG_NAME'); if (!Object.keys(m).length) throw new Error('empty CJS exports')"
          node --input-type=module -e "import('$PKG_NAME').then(m => { if (!Object.keys(m).length) throw new Error('empty ESM exports') })"

      # The step above proves the package loads. It cannot prove any binding
      # works -- it would pass unchanged if every export threw. The host-target
      # tests in `ci.yml` cover the wire contract, but they run on the pure core
      # with no `JsValue` anywhere; what is only observable here is whether a
      # real JS object survives the boundary and comes back with the documented
      # shape. This is the last gate before `npm publish`.
      - name: Node behaviour gate (bindings actually answer)
        run: |
          PKG_NAME=$(node -p "require('./pkg/package.json').name")
          cd "$RUNNER_TEMP/smoke"
          cat > gate.mjs <<'EOF'
          const m = await import(process.env.PKG_NAME)
          const ok = (c, msg) => { if (!c) throw new Error(msg) }

          const subgroups = [
            [9.9, 10.1, 10.0, 9.8, 10.2], [10.3, 9.7, 10.0, 10.1, 9.9],
            [9.8, 10.2, 10.1, 9.9, 10.0], [10.5, 9.5, 10.0, 10.2, 9.8],
            [9.6, 10.4, 10.0, 9.9, 10.1], [10.1, 9.9, 10.0, 10.3, 9.7],
          ]
          const data = subgroups.flat()

          // A native JS object must cross the boundary and come back shaped as
          // documented -- omitting sigma_within reports the long-term family
          // only, with the short-term one null rather than borrowed.
          const overall = m.process_capability({ data, usl: 11, lsl: 9 })
          ok(overall.sigma_source === 'overall', `sigma_source=${overall.sigma_source}`)
          ok(overall.cp === null || overall.cp === undefined, 'cp must be null without sigma_within')
          ok(typeof overall.pp === 'number', 'pp must be present')

          // sigma_hat is what makes the two bindings compose: the chart hands
          // over the quantity a flat vector cannot carry.
          const chart = m.xbar_r_chart(subgroups)
          ok(typeof chart.sigma_hat === 'number', 'xbar_r_chart must expose sigma_hat')

          const within = m.process_capability({ data, usl: 11, lsl: 9, sigma_within: chart.sigma_hat })
          ok(within.sigma_source === 'within', `sigma_source=${within.sigma_source}`)
          ok(within.cp !== within.pp, 'cp and pp must come from different sigmas')

          // A one-sided specification is expressible.
          const upper = m.process_capability({ data, usl: 11 })
          ok(upper.pp === null || upper.pp === undefined, 'Pp needs both limits')
          ok(typeof upper.ppu === 'number', 'an upper limit supports Ppu')

          // The wire schema is strict, and a stringified payload is refused
          // with an actionable message rather than a serde error.
          let threw = false
          try { m.process_capability({ data, usl: 11, sigmaWithin: 0.3 }) } catch { threw = true }
          ok(threw, 'unknown key must be rejected')

          threw = false
          try { m.process_capability(JSON.stringify({ data, usl: 11 })) } catch { threw = true }
          ok(threw, 'a JSON string must be rejected, not parsed')

          console.log('binding behaviour gate: ok')
          EOF
          PKG_NAME="$PKG_NAME" node gate.mjs

      - name: Publish to npm
        run: |
          cd pkg
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version 2>/dev/null; then
            echo "Version ${PKG_VER} already published, skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
